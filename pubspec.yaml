name: flutter_ai_ui_kit
description: >-
  A production-ready Flutter UI kit for building beautiful AI chat interfaces.
  Includes ChatBubble, TypingIndicator, StreamingText, VoiceWave, GlassInputField,
  PromptCard, MessageReactionBar, and ChatScreenScaffold,fully animated, themed,
  and pub.dev optimized.
version: 0.1.0
homepage: https://github.com/bhpy247/flutter_ai_ui_kit
repository: https://github.com/bhpy247/flutter_ai_ui_kit
issue_tracker: https://github.com/bhpy247/flutter_ai_ui_kit/issues

topics:
  - chat
  - ai
  - ui
  - widgets
  - animations

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
# No assets needed,all UI is code-based for max portability